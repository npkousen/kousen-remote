[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kousen-remote"
version = "0.1.0"
description = "Standalone Linux remote input service and diagnostics."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Nicholas Kousen" },
]
keywords = ["bluetooth", "bluez", "linux", "remote", "uinput", "kiosk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "dbus-next>=0.2.3",
  "evdev>=1.7; sys_platform == 'linux'",
]

[project.optional-dependencies]
test = []

[project.scripts]
kousen-remote = "kousen_remote.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kousen_remote = ["py.typed"]
