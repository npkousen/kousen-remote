[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kousen-remote"
version = "0.1.0"
description = "Standalone Linux remote input service and diagnostics."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "dbus-next>=0.2.3",
]

[project.optional-dependencies]
test = []

[project.scripts]
kousen-remote = "kousen_remote.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kousen_remote = ["py.typed"]
